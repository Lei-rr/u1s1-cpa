name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Linux amd64
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildmode=c-shared -ldflags '-s -w' -o "dist/u1s1.so" .
          rm -f dist/u1s1.h
          echo "asset=u1s1_${VERSION}_linux_amd64.zip" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          zip -q -X "$asset" u1s1.so
          sha256sum "$asset" > "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: u1s1-linux-amd64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/u1s1.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          find artifacts -name '*.sha256' -exec cat {} \; | sort > release/checksums.txt
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/checksums.txt
          generate_release_notes: true

